# YOLOv8数据集配置文件
# 用于电连接器检测、分割和分类

# 数据集路径
path: ./data  # 数据集根目录
train: images/train  # 训练集相对路径
val: images/val      # 验证集相对路径
test: images/test    # 测试集相对路径（可选）

# 类别数量
nc: 4

# 类别名称
names:
  0: connector_shell  # 连接器壳体
  1: cable            # 线缆
  2: tag_A            # 标签A
  3: tag_B            # 标签B
  # 可根据实际情况扩展更多标签类别

# 数据集统计信息（可选）
# 在训练前会自动统计
# num_train: 3675
# num_val: 1050
# num_test: 525

