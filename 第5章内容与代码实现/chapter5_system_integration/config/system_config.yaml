# 系统配置文件

# 机器人配置
robot:
  type: "ur5e"
  base_frame: "base_link"
  end_effector_frame: "tool0"
  joint_names: ["shoulder_pan_joint", "shoulder_lift_joint", "elbow_joint",
                "wrist_1_joint", "wrist_2_joint", "wrist_3_joint"]

# 相机配置
camera:
  type: "realsense_d435i"
  frame_id: "camera_color_optical_frame"
  rgb_topic: "/camera/color/image_raw"
  depth_topic: "/camera/aligned_depth_to_color"

# 力传感器配置
force_sensor:
  type: "ati_gamma"
  topic: "/ft_sensor/raw"
  frame_id: "ft_sensor_frame"
  max_force: 30.0  # 急停阈值（N）

# 系统参数
system:
  control_frequency: 500  # 控制频率（Hz）
  vision_frequency: 30    # 视觉频率（Hz）
  planning_timeout: 10.0  # 规划超时（秒）
  assembly_timeout: 30.0   # 装配超时（秒）

# 安全参数
safety:
  force_threshold: 30.0    # 力阈值（N）
  joint_limit_margin: 0.1  # 关节限位边距（rad）
  emergency_stop_enabled: true

# 实验配置
experiment:
  target_connector_ids: ["A", "B", "C"]
  num_trials: 50
  data_recording_enabled: true

